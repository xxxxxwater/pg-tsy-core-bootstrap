[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pg-tsy-research"
version = "0.1.0"
description = "Research plane for pg-tsy-core"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "polars>=1.0",
  "pyarrow>=16",
]

[project.optional-dependencies]
ml = ["torch>=2.4"]
train = [
  "torch>=2.4",
  "optuna>=4.0",
  "scikit-learn>=1.5",
]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
pg-tsy = "pg_tsy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pg_tsy"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
