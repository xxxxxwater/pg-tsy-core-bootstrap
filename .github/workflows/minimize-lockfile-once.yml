name: minimize-lockfile-once
on:
  push:
    branches: [feat/python-rust-sim-orders-20260920]

permissions:
  contents: write

concurrency:
  group: minimize-lockfile-feat-python-rust-sim-orders-20260920
  cancel-in-progress: true

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/python-rust-sim-orders-20260920
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: restore base lock and resolve only required new dependency
        run: |
          git show origin/main:rust/Cargo.lock > rust/Cargo.lock
          cd rust
          cargo check -p pg-core
      - name: commit minimal lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/Cargo.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(rust): minimize lockfile for mimalloc"
          git pull --rebase origin feat/python-rust-sim-orders-20260920
          git push origin HEAD:feat/python-rust-sim-orders-20260920
