name: guard-runner-once
on:
  push:
    branches: [fix/unattended-runtime-gates-20260920]
    paths: [.github/workflows/guard-runner-once.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unattended-runtime-gates-20260920
          persist-credentials: true
      - name: Execute exact-match patch stored in temporary branch file
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/apply-unattended-guard-once.yml').read_text().splitlines()
          start = lines.index("          python3 - <<'PY'") + 1
          end = lines.index('          PY', start)
          code = []
          in_multiline = False
          for line in lines[start:end]:
              if in_multiline:
                  code.append(line)
              else:
                  assert line.startswith('          '), repr(line)
                  code.append(line[10:])
              if line.count("'''") % 2:
                  in_multiline = not in_multiline
          assert not in_multiline
          source = '\n'.join(code) + '\n'
          exec(compile(source, 'exact_guard_patch.py', 'exec'))
          PY
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt,clippy
      - name: Format and validate production runtime
        working-directory: rust
        run: |
          cargo fmt --all
          cargo test -p pg-core --all-targets
          cargo clippy -p pg-core --all-targets -- -D warnings
          cargo clippy -p pg-core --all-targets --features ibkr-marketdata -- -D warnings
      - name: Commit validated changes
        run: |
          git config user.name pg-tsy-guard-ci
          git config user.email pg-tsy-guard-ci@users.noreply.github.com
          git add rust/crates/pg-core/src/main.rs rust/crates/pg-core/src/live_daemon.rs rust/crates/pg-core/src/unattended_guard.rs
          git commit -m 'fix(runtime): gate topology recovery and persist policy in-flight ownership'
          git push origin HEAD:fix/unattended-runtime-gates-20260920
