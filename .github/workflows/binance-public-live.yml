name: binance-public-live

# Real exchange smoke cannot run reliably on US GitHub-hosted runners:
# Binance public depth REST returned HTTP 451 on 2026-09-18 (run 35343735329).
# Retain this strict fail-on-451 test for operator-invoked diagnosis; do not
# weaken it or mark it successful without a genuine REST/WS L2 bridge.
# This job uses no secrets, account endpoints or order submission capability.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-feed-reconnect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Read-only live BTCUSDC BBO reconnect and REST/L2 bridge
        env:
          PG_LIVE_TRADING: 'false'
        run: cargo test --locked -p pg-binance --test live_public -- --ignored --nocapture
