name: one-shot-private-stream-format
on:
  push:
    paths:
      - '.github/workflows/format-user-transport-once.yml'
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'xxxxxwater/pg-tsy-core-bootstrap' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt,clippy
      - name: Format Rust and verify only new private transport changed
        run: |
          cargo fmt --all
          cargo fmt --check
          cargo metadata --locked --format-version 1 > /dev/null
          changed=$(git diff --name-only)
          if [ "$changed" != 'rust/adapters/pg-binance/src/user_transport.rs' ]; then
            echo "Unexpected format changes: $changed"
            exit 1
          fi
      - name: Verify offline trading contract before pushing
        run: |
          cargo test -p pg-binance --all-targets
          cargo test -p pg-marketdata binance_depth --lib
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Push validated formatting on main without force
        run: |
          git diff --check
          git add adapters/pg-binance/src/user_transport.rs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(binance): format PM user-stream transport with Rust 1.98.1'
          git push origin HEAD:main
