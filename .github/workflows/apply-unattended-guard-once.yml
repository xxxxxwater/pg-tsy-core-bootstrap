name: apply-unattended-guard-once
on:
  push:
    branches: [fix/unattended-runtime-gates-20260920]
    paths: [.github/workflows/apply-unattended-guard-once.yml]
permissions:
  contents: write
jobs:
  integrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unattended-runtime-gates-20260920
          persist-credentials: true
      - name: Integrate fail-closed runtime guards with exact-match patches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          main = Path('rust/crates/pg-core/src/main.rs')
          text = main.read_text()
          assert text.count('mod secrets;') == 1
          main.write_text(text.replace('mod secrets;', 'mod secrets;\nmod unattended_guard;'))
          file = Path('rust/crates/pg-core/src/live_daemon.rs')
          text = file.read_text()
          def change(before, after):
              global text
              count = text.count(before)
              assert count == 1, f'expected exactly one patch anchor, got {count}: {before[:100]!r}'
              text = text.replace(before, after, 1)
          change('    secrets::{bool_env, optional_secret, required_secret, required_value},', '    secrets::{bool_env, optional_secret, required_secret, required_value},\n    unattended_guard::{EntryGuard, policy_order_busy},')
          change('    let mut trading_started = auto_start && startup_clean && ambiguous_clean;\n    let mut risk_limits = RiskLimits {\n        allow_new_exposure: trading_started,', '    let mut trading_started = auto_start && startup_clean && ambiguous_clean;\n    let mut entry_guard = EntryGuard::new(startup_clean && ambiguous_clean);\n    let mut risk_limits = RiskLimits {\n        allow_new_exposure: false,')
          change('                            if submit_intent(\n                                execution.as_ref(),\n                                &risk_limits,\n                                &runtime_pins.safe_hold,\n                                &strategy_id,\n                                &intent,\n                            )\n                            .await\n                            .is_some()\n                            {', '                            if matches!(\n                                submit_intent(\n                                    execution.as_ref(),\n                                    &risk_limits,\n                                    &runtime_pins.safe_hold,\n                                    &strategy_id,\n                                    &intent,\n                                ).await,\n                                DispatchOutcome::Attempted { acknowledged: true, .. }\n                            ) {')
          change('                    if strategy_is_busy(\n                        execution.as_ref(),\n                        &mut live_policy_intents,\n                        &routed.strategy_id,\n                    )\n                    .await\n                    {', '                    if policy_order_busy(\n                        &routed.strategy_id,\n                        &latest_orders,\n                        &mut live_policy_intents,\n                    ) {')
          change('                    if let Some(client_order_id) = submit_intent(\n                        execution.as_ref(),\n                        &risk_limits,\n                        &runtime_pins.safe_hold,\n                        &strategy_id,\n                        &intent,\n                    )\n                    .await\n                    {\n                        orders_journaled = orders_journaled.saturating_add(1);\n                        live_policy_intents.insert(strategy_id, (intent.venue, client_order_id));\n                    }', '                    if let DispatchOutcome::Attempted { client_order_id, acknowledged } = submit_intent(\n                        execution.as_ref(),\n                        &risk_limits,\n                        &runtime_pins.safe_hold,\n                        &strategy_id,\n                        &intent,\n                    ).await {\n                        if acknowledged {\n                            orders_journaled = orders_journaled.saturating_add(1);\n                        }\n                        // Even a lost ACK may have placed a live order. Only a\n                        // cleanly reconciled matching terminal record may unlock.\n                        live_policy_intents.insert(strategy_id, (intent.venue, client_order_id));\n                    }')
          change('                for venue in venues.iter().copied() {\n                    match execution.reconcile_once(venue).await {', '                for venue in venues.iter().copied() {\n                    match execution.recover_ambiguous(venue).await {\n                        Ok(recovery) => {\n                            for item in recovery.items {\n                                if !item.resolved {\n                                    clean = false;\n                                    cycle_safe_hold.insert(AssetKey::new(item.venue, item.asset));\n                                }\n                            }\n                        }\n                        Err(error) => {\n                            clean = false;\n                            tracing::error!(?venue, %error, "ambiguous-order recovery failed; freezing new exposure");\n                            continue;\n                        }\n                    }\n                    match execution.reconcile_once(venue).await {')
          change('                risk_limits.allow_new_exposure =\n                    trading_started && clean && supervisor.all_connected();', '                entry_guard.reconcile_result(clean);\n                risk_limits.allow_new_exposure = entry_guard.may_increase(\n                    trading_started,\n                    checklist.ready_for(config.mode),\n                    supervisor.all_connected(),\n                );')
          change('            _ = universe_tick.tick(), if dynamic_enabled => {\n                risk_limits.allow_new_exposure = false;', '            _ = universe_tick.tick(), if dynamic_enabled => {\n                risk_limits.allow_new_exposure = false;\n                entry_guard.begin_topology_change();')
          change('                            validate_live_feeds(&next_feeds)?;\n                            ensure_venues_registered(&next_feeds, &venues)?;', '                            if next_feeds.is_empty() {\n                                bail!("dynamic universe produced zero market-data feeds");\n                            }\n                            validate_live_feeds(&next_feeds)?;\n                            ensure_venues_registered(&next_feeds, &venues)?;')
          change('                            Ok(()) => {\n                                feeds = next_feeds;', '                            Ok(()) => {\n                                entry_guard.topology_validated();\n                                feeds = next_feeds;')
          change('                            Err(error) => {\n                                tracing::error!(%error, "dynamic topology apply failed; exposure remains frozen");', '                            Err(error) => {\n                                entry_guard.topology_failed(error.to_string());\n                                tracing::error!(%error, "dynamic topology apply failed; exposure remains frozen");')
          change('                    Err(error) => {\n                        tracing::error!(%error, "dynamic universe refresh failed; exposure remains frozen");', '                    Err(error) => {\n                        entry_guard.topology_failed(error.to_string());\n                        tracing::error!(%error, "dynamic universe refresh failed; exposure remains frozen");')
          change('                let ready = checklist.ready_for(config.mode);\n                let blocking = blocking_gate_names(&checklist, config.mode);', '                let checklist_ready = checklist.ready_for(config.mode);\n                let ready = entry_guard.ready(checklist_ready);\n                let mut blocking = blocking_gate_names(&checklist, config.mode);\n                if let Some(reason) = entry_guard.topology_blocker() {\n                    blocking.push(format!("DynamicTopology: {reason}"));\n                }\n                risk_limits.allow_new_exposure = entry_guard.may_increase(\n                    trading_started, checklist_ready, supervisor.all_connected(),\n                );')
          start = text.index('            Some(command) = control_rx.recv() => {')
          end = text.index('            signal = tokio::signal::ctrl_c() => {', start)
          original = text[start:end]
          assert original.count('ControlCommand::ReloadStrategies') == 1
          replacement = '''            Some(command) = control_rx.recv() => {
                match command {
                    ControlCommand::ReloadStrategies => {
                        // A failed reload can have partially changed the registry.
                        // A passing periodic reconcile must never lift this pause.
                        risk_limits.allow_new_exposure = false;
                        entry_guard.begin_topology_change();
                        match reload_strategies(&mut registry, strategy_dir.as_deref()) {
                            Ok(ids) => {
                                if registry.has_dynamic_templates() != dynamic_enabled {
                                    let reason = "strategy reload changed dynamic-template mode; restart required".to_string();
                                    entry_guard.topology_failed(reason.clone());
                                    health.mutate(|snapshot| snapshot.last_error = Some(reason)).await;
                                } else if !dynamic_enabled {
                                    let next_feeds = registry.subscriptions();
                                    let applied: Result<()> = (|| {
                                        if next_feeds.is_empty() {
                                            bail!("strategy reload produced zero market-data feeds");
                                        }
                                        validate_live_feeds(&next_feeds)?;
                                        ensure_venues_registered(&next_feeds, &venues)?;
                                        feed_tasks.sync(next_feeds.clone(), &mut supervisor, &event_tx, &fatal_tx)?;
                                        Ok(())
                                    })();
                                    match applied {
                                        Ok(()) => {
                                            feeds = next_feeds;
                                            entry_guard.topology_validated();
                                            health.mutate(|snapshot| snapshot.feeds_total = feeds.len()).await;
                                        }
                                        Err(error) => {
                                            let reason = error.to_string();
                                            entry_guard.topology_failed(reason.clone());
                                            health.mutate(|snapshot| snapshot.last_error = Some(reason)).await;
                                        }
                                    }
                                }
                                tracing::info!(strategies = ?ids, "strategy definitions reloaded; exposure gated on topology and reconciliation");
                            }
                            Err(error) => {
                                let reason = error.to_string();
                                entry_guard.topology_failed(reason.clone());
                                tracing::warn!(%reason, "strategy reload rejected; exposure remains frozen");
                                health.mutate(|snapshot| snapshot.last_error = Some(reason)).await;
                            }
                        }
                    }
                }
            }
'''
          text = text[:start] + replacement + text[end:]
          change('async fn submit_intent(\n', 'enum DispatchOutcome {\n    Rejected,\n    Attempted { client_order_id: String, acknowledged: bool },\n}\n\nasync fn submit_intent(\n')
          change('    intent: &OrderIntent,\n) -> Option<String> {', '    intent: &OrderIntent,\n) -> DispatchOutcome {')
          start = text.index('async fn submit_intent(')
          end = text.index('fn policy_intent(', start)
          segment = text[start:end]
          assert segment.count('return None;') == 2
          segment = segment.replace('return None;', 'return DispatchOutcome::Rejected;')
          assert segment.count('Some(client_order_id)') == 1
          segment = segment.replace('Some(client_order_id)', 'DispatchOutcome::Attempted { client_order_id, acknowledged: true }')
          original_error = '''            None
        }
    }
}
'''
          assert segment.count(original_error) == 1
          segment = segment.replace(original_error, '''            DispatchOutcome::Attempted { client_order_id, acknowledged: false }
        }
    }
}
''')
          # Delete the previous venue-lookup busy function: missing lookup is NOT terminal evidence.
          guard_begin = segment.index('async fn strategy_is_busy(')
          segment = segment[:guard_begin]
          text = text[:start] + segment + text[end:]
          file.write_text(text)
          print('Patched production runtime: explicit independent gates, recovery-before-reconcile, durable policy busy guard.')
          PY
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt,clippy
      - name: Format and test real runtime
        working-directory: rust
        run: |
          cargo fmt --all
          cargo test -p pg-core --all-targets
          cargo clippy -p pg-core --all-targets -- -D warnings
          cargo clippy -p pg-core --all-targets --features ibkr-marketdata -- -D warnings
      - name: Commit validated production changes on isolated branch
        run: |
          git config user.name 'pg-tsy-guard-ci'
          git config user.email 'pg-tsy-guard-ci@users.noreply.github.com'
          git add rust/crates/pg-core/src/main.rs rust/crates/pg-core/src/live_daemon.rs rust/crates/pg-core/src/unattended_guard.rs
          git commit -m 'fix(runtime): keep topology and ambiguous-order gates closed until evidenced recovery'
          git push origin HEAD:fix/unattended-runtime-gates-20260920
