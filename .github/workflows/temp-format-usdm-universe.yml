name: temp-format-usdm-universe
on:
  push:
    paths:
      - '.github/workflows/temp-format-usdm-universe.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt
      - name: Format new USD-M research catalog
        run: |
          cd rust
          cargo fmt --all
          cd ..
          git add rust/adapters/pg-binance/src/market_universe.rs
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(binance): rustfmt public USD-M research catalog'
            git push origin HEAD:main
          fi
