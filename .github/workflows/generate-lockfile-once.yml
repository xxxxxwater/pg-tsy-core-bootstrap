name: generate-lockfile-once
on:
  push:
    branches: [feat/python-rust-sim-orders-20260920]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/python-rust-sim-orders-20260920
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: regenerate lockfile
        working-directory: rust
        run: cargo generate-lockfile
      - name: commit generated lockfile when changed
        run: |
          if git diff --quiet -- rust/Cargo.lock; then
            echo "Cargo.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/Cargo.lock
          git commit -m "chore(rust): refresh lockfile for mimalloc"
          git push origin HEAD:feat/python-rust-sim-orders-20260920
