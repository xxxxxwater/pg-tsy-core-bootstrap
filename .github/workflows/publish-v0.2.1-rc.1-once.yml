name: Publish PG-TSY v0.2.1-rc.1 RSS / Coinbase sidecar prerelease

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v0.2.1-rc.1-once.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pg-tsy-v0.2.1-rc.1-one-time-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'xxxxxwater/pg-tsy-core-bootstrap'
    name: Test, publish GHCR image, create immutable prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/xxxxxwater/pg-tsy-coinbase-rss-sidecar
      RELEASE_TAG: v0.2.1-rc.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify no live-trading state or credentials in the release
        shell: bash
        run: |
          set -euo pipefail
          test -f integrations/coinbase_rss_live/Dockerfile
          test -f integrations/coinbase_rss_live/compose.yaml
          test -f integrations/coinbase_rss_live/src/monitor.py
          test -f integrations/coinbase_rss_live/src/worker.py
          test -f docs/releases/v0.2.1-rc.1.md
          grep -q 'PG_LIVE_TRADING.*false' integrations/coinbase_rss_live/compose.yaml
          test ! -e integrations/coinbase_rss_live/.env
          test ! -e integrations/coinbase_rss_live/secrets
          test ! -e integrations/coinbase_rss_live/state
          echo 'Release excludes live credentials and persistent operational state'
      - name: Compile and run isolated tests (no exchange calls)
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q integrations/coinbase_rss_live/src integrations/coinbase_rss_live/tests
          python -m unittest discover -s integrations/coinbase_rss_live/tests -v
          for f in integrations/coinbase_rss_live/scripts/*.sh; do bash -n "$f"; done
      - name: Confirm immutable release tag is unused
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo '::error::Release already exists; do not overwrite published assets'
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo '::error::Existing tag must never be retargeted'
            exit 1
          fi
      - name: Build minimal runtime image without secrets
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull --file integrations/coinbase_rss_live/Dockerfile --tag "$IMAGE:$RELEASE_TAG" integrations/coinbase_rss_live
          test "$(docker run --rm --network none --entrypoint id "$IMAGE:$RELEASE_TAG" -u)" = '1000'
          docker run --rm --network none --entrypoint python "$IMAGE:$RELEASE_TAG" -c 'import sys; assert sys.version_info >= (3, 13)'
      - name: Build scoped ZIP/TAR source assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          prefix="pg-tsy-coinbase-rss-$RELEASE_TAG/"
          git archive --format=zip --prefix="$prefix" --output="dist/pg-tsy-coinbase-rss-$RELEASE_TAG.zip" HEAD README.md integrations/coinbase_rss_live docs/releases/v0.2.1-rc.1.md docs/PUREGAMMA_RSS_COINBASE_LIVE.md
          git archive --format=tar.gz --prefix="$prefix" --output="dist/pg-tsy-coinbase-rss-$RELEASE_TAG.tar.gz" HEAD README.md integrations/coinbase_rss_live docs/releases/v0.2.1-rc.1.md docs/PUREGAMMA_RSS_COINBASE_LIVE.md
          ( cd dist && sha256sum *.zip *.tar.gz > SHA256SUMS.txt )
      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push VERSIONED experimental image (never latest)
        shell: bash
        run: |
          set -euo pipefail
          docker push "$IMAGE:$RELEASE_TAG"
          docker manifest inspect "$IMAGE:$RELEASE_TAG" >/dev/null
          echo "Pushed $IMAGE:$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
      - name: Create GitHub prerelease with ZIP/TAR and SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "PG-TSY Core $RELEASE_TAG — RSS V4 + Coinbase Sidecar Preview" \
            --notes-file docs/releases/v0.2.1-rc.1.md \
            --prerelease
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$GITHUB_SHA"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url,isDraft,isPrerelease,assets --jq '.url + " | prerelease=" + (.isPrerelease|tostring) + " | assets=" + ([.assets[].name]|join(","))' | tee -a "$GITHUB_STEP_SUMMARY"
