name: daemon-observability
on:
  push:
  pull_request:

jobs:
  shadow-daemon:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pgtsy_ci
          POSTGRES_PASSWORD: only-for-ci
          POSTGRES_DB: pgtsy_daemon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pgtsy_ci -d pgtsy_daemon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: rust
    env:
      PG_RUN_MODE: shadow
      PG_LIVE_TRADING: "false"
      PG_ENV: ci
      PG_INSTANCE_ID: daemon-observability-ci
      PG_DATABASE_URL: postgres://pgtsy_ci:only-for-ci@127.0.0.1:5432/pgtsy_daemon_test
      PG_LEASE_KEY: pg-core:ci:daemon-observability
      PG_STRATEGY_DIR: ../data/replay/strategies
      PG_SHADOW_MARKET_FIXTURE: ../data/replay/daemon_smoke.jsonl
      PG_SHADOW_FIXTURE_INTERVAL_MS: "25"
      PG_SHADOW_FILL_MODE: immediate
      PG_HEALTH_ADDR: 127.0.0.1:18080
      PG_OBSERVABILITY_ENABLED: "true"
      PG_OBSERVABILITY_BIND: 0.0.0.0:18787
      PG_OBSERVABILITY_TOKEN: 0123456789abcdefghijklmnopqrstuvwxyz
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt,clippy
      - run: cargo fmt --check
      - run: cargo build -p pg-core
      - name: Start real shadow daemon and prove operator surfaces
        shell: bash
        run: |
          set -euo pipefail
          target/debug/pg-core --serve >/tmp/pg-core-daemon.log 2>&1 &
          pid=$!
          cleanup() {
            kill -INT "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            cat /tmp/pg-core-daemon.log || true
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:18080/readyz >/tmp/ready.json; then
              if jq -e '.ready == true' /tmp/ready.json >/dev/null; then
                ready=1
                break
              fi
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "pg-core exited before readiness"
              exit 1
            fi
            sleep 1
          done
          test "$ready" -eq 1
          jq -e '.lease_healthy == true and .feeds_connected == .feeds_total and .feeds_total >= 4' /tmp/ready.json

          code=$(curl -sS -o /tmp/denied.json -w '%{http_code}' http://127.0.0.1:18787/v1/snapshot)
          test "$code" = "401"

          snapshot_ready=0
          for _ in $(seq 1 10); do
            curl -fsS               -H "Authorization: Bearer $PG_OBSERVABILITY_TOKEN"               http://127.0.0.1:18787/v1/snapshot >/tmp/snapshot.json
            if jq -e '
              .schema_version == "runtime.snapshot.v1" and
              .runtime.mode == "shadow" and
              .startup.ready == true and
              .safety.state == "SHADOW" and
              .lease.owned == true and
              (.lease.fencing_token != null) and
              ([.feeds[].status] | all(. == "HEALTHY")) and
              (.feeds | length) >= 4 and
              (.venues | any(
                .id == "HYPERLIQUID" and
                .market_data == "HEALTHY" and
                .execution == "HEALTHY" and
                .reconcile == "HEALTHY"
              )) and
              (.positions | type == "array") and
              (.orders.recent | type == "array")
            ' /tmp/snapshot.json >/dev/null; then
              snapshot_ready=1
              break
            fi
            sleep 1
          done
          test "$snapshot_ready" -eq 1

          curl -fsS             -H "Authorization: Bearer $PG_OBSERVABILITY_TOKEN"             'http://127.0.0.1:18787/v1/events?after=0&limit=20' >/tmp/events.json
          jq -e '.events | any(.type == "observability.enabled")' /tmp/events.json

          kill -INT "$pid"
          wait "$pid"
          trap - EXIT

      - name: Stale market data must force SAFE_HOLD
        shell: bash
        env:
          PG_INSTANCE_ID: daemon-observability-stale-ci
          PG_LEASE_KEY: pg-core:ci:daemon-observability-stale
          PG_SHADOW_FIXTURE_CYCLES: "1"
          PG_MAX_MARKET_STALENESS_MS: "3000"
        run: |
          set -euo pipefail
          target/debug/pg-core --serve >/tmp/pg-core-stale.log 2>&1 &
          pid=$!
          cleanup() {
            kill -INT "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            cat /tmp/pg-core-stale.log || true
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18080/readyz >/tmp/stale-ready.json; then
              if jq -e '.ready == true' /tmp/stale-ready.json >/dev/null; then
                ready=1
                break
              fi
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "stale-injection daemon exited before initial readiness"
              exit 1
            fi
            sleep 1
          done
          test "$ready" -eq 1

          stale=0
          for _ in $(seq 1 12); do
            code=$(curl -sS -o /tmp/stale-ready.json -w '%{http_code}' http://127.0.0.1:18080/readyz || true)
            if [ "$code" = "503" ]; then
              stale=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "stale-injection daemon exited instead of staying fail-closed"
              exit 1
            fi
            sleep 1
          done
          test "$stale" -eq 1

          curl -fsS             -H "Authorization: Bearer $PG_OBSERVABILITY_TOKEN"             http://127.0.0.1:18787/v1/snapshot >/tmp/stale-snapshot.json
          jq -e '
            .startup.ready == false and
            .safety.state == "SAFE_HOLD" and
            .safety.allow_new_exposure == false and
            ([.feeds[].status] | any(. == "STALE"))
          ' /tmp/stale-snapshot.json

          kill -INT "$pid"
          wait "$pid"
          trap - EXIT

      - name: Reconcile drift must enter SAFE_HOLD without killing daemon
        shell: bash
        env:
          PG_INSTANCE_ID: daemon-observability-reconcile-ci
          PG_LEASE_KEY: pg-core:ci:daemon-observability-reconcile
          PG_RECONCILE_INTERVAL_MS: "250"
          PG_SHADOW_FIXTURE_CYCLES: "1"
          PG_MAX_MARKET_STALENESS_MS: "60000"
          PG_SHADOW_RECONCILE_FAULT_AFTER_MS: "3000"
          PG_SHADOW_RECONCILE_FAULT_VENUE: HYPERLIQUID
          PG_SHADOW_RECONCILE_FAULT_ASSET: PG_TEST_GHOST
          PG_SHADOW_RECONCILE_FAULT_QUANTITY: "1"
        run: |
          set -euo pipefail
          target/debug/pg-core --serve >/tmp/pg-core-reconcile.log 2>&1 &
          pid=$!
          cleanup() {
            kill -INT "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            cat /tmp/pg-core-reconcile.log || true
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18080/readyz >/tmp/reconcile-ready.json; then
              if jq -e '.ready == true' /tmp/reconcile-ready.json >/dev/null; then
                ready=1
                break
              fi
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "reconcile-injection daemon exited before initial readiness"
              exit 1
            fi
            sleep 1
          done
          test "$ready" -eq 1

          held=0
          for _ in $(seq 1 15); do
            code=$(curl -sS -o /tmp/reconcile-ready.json -w '%{http_code}' http://127.0.0.1:18080/readyz || true)
            curl -fsS               -H "Authorization: Bearer $PG_OBSERVABILITY_TOKEN"               http://127.0.0.1:18787/v1/snapshot >/tmp/reconcile-snapshot.json
            if [ "$code" = "503" ] && jq -e '
              .startup.ready == false and
              .safety.state == "SAFE_HOLD" and
              .safety.allow_new_exposure == false and
              .reconcile.status == "DEGRADED" and
              .reconcile.mismatch_count >= 1
            ' /tmp/reconcile-snapshot.json >/dev/null; then
              held=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "reconcile fault killed daemon instead of holding safely"
              exit 1
            fi
            sleep 1
          done
          test "$held" -eq 1
          kill -0 "$pid"

          kill -INT "$pid"
          wait "$pid"
          trap - EXIT

      - name: Lease theft must fence and terminate old owner
        shell: bash
        env:
          PG_INSTANCE_ID: daemon-observability-lease-ci
          PG_LEASE_KEY: pg-core:ci:daemon-observability-lease
          PG_LEASE_TTL_SECONDS: "6"
        run: |
          set -euo pipefail
          target/debug/pg-core --serve >/tmp/pg-core-lease.log 2>&1 &
          pid=$!
          cleanup() {
            kill -INT "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            cat /tmp/pg-core-lease.log || true
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18080/readyz >/tmp/lease-ready.json; then
              if jq -e '.ready == true and .lease_healthy == true' /tmp/lease-ready.json >/dev/null; then
                ready=1
                break
              fi
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "lease-injection daemon exited before initial readiness"
              exit 1
            fi
            sleep 1
          done
          test "$ready" -eq 1

          before=$(docker run --rm --network host             -e PGPASSWORD=only-for-ci postgres:16             psql -h 127.0.0.1 -U pgtsy_ci -d pgtsy_daemon_test -Atc             "SELECT holder_id || ':' || fencing_token FROM runtime_leases WHERE lease_key = '$PG_LEASE_KEY'")
          echo "lease before theft: $before"
          test -n "$before"

          docker run --rm --network host             -e PGPASSWORD=only-for-ci postgres:16             psql -h 127.0.0.1 -U pgtsy_ci -d pgtsy_daemon_test -v ON_ERROR_STOP=1 -c             "UPDATE runtime_leases SET holder_id='fault-injector', fencing_token=fencing_token+1, lease_expires_at=now()+interval '60 seconds', updated_at=now() WHERE lease_key='$PG_LEASE_KEY';"

          after=$(docker run --rm --network host             -e PGPASSWORD=only-for-ci postgres:16             psql -h 127.0.0.1 -U pgtsy_ci -d pgtsy_daemon_test -Atc             "SELECT holder_id || ':' || fencing_token FROM runtime_leases WHERE lease_key = '$PG_LEASE_KEY'")
          echo "lease after theft: $after"
          [[ "$after" == fault-injector:* ]]
          test "$after" != "$before"

          exited=0
          for _ in $(seq 1 12); do
            if ! kill -0 "$pid" 2>/dev/null; then
              exited=1
              break
            fi
            sleep 1
          done
          test "$exited" -eq 1

          set +e
          wait "$pid"
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -Eq 'runtime lease lost|runtime fencing lease invalid|fencing' /tmp/pg-core-lease.log
          trap - EXIT

      - run: cargo clippy -p pg-core -p pg-observability --all-targets -- -D warnings
