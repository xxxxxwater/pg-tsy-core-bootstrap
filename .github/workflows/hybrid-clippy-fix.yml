name: hybrid-clippy-fix
on:
  push:
    branches: [feat/hybrid-sim-rl-orders-20260920]
permissions:
  contents: write
jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt,clippy
      - name: Apply exact targeted corrections to pg-sim
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/pg-sim/src/lib.rs')
          s = p.read_text()
          a = '        if let Some(peer) = activate_peer {'
          b = '        if let Some((peer, delta)) = resize_peer {'
          assert s.count(a) == 1 and s.count(b) == 1
          start, end = s.index(a), s.index(b)
          s = s[:start] + '\n'.join([
              '        if let Some(peer) = activate_peer',
              '            && let Some(record) = self.orders.get_mut(&peer)',
              '            && record.state == SimOrderState::Dormant',
              '        {',
              '            record.state = SimOrderState::Resting;',
              '        }',
              '',
          ]) + s[end:]
          a = '        if let Some((peer, delta)) = resize_peer {'
          b = '\n\n        Ok(outcome)'
          assert s.count(a) == 1 and s.count(b) == 1
          start, end = s.index(a), s.index(b, s.index(a))
          s = s[:start] + '\n'.join([
              '        if let Some((peer, delta)) = resize_peer',
              '            && let Some(record) = self.orders.get_mut(&peer)',
              '            && !matches!(',
              '                record.state,',
              '                SimOrderState::Filled | SimOrderState::Canceled | SimOrderState::Rejected',
              '            )',
              '        {',
              '            record.order.quantity =',
              '                (record.order.quantity - delta).max(record.filled_quantity);',
              '            if record.remaining() == Decimal::ZERO {',
              '                record.state = SimOrderState::Canceled;',
              '            }',
              '        }',
          ]) + s[end:]
          a = '    if let Some(display) = order.display_quantity {'
          b = '    Ok(())'
          assert s.count(a) == 1 and s.count(b) == 2
          start = s.index(a)
          end = s.index(b, start)
          s = s[:start] + '\n'.join([
              '    if let Some(display) = order.display_quantity',
              '        && (display <= Decimal::ZERO || display > order.quantity)',
              '    {',
              '        return Err(SimError::InvalidDisplayQuantity);',
              '    }',
              '',
          ]) + s[end:]
          p.write_text(s)
          PY
          cargo fmt --all
          cargo fmt --check
      - name: Simulator Clippy and tests
        run: |
          cargo clippy -p pg-sim --all-targets -- -D warnings
          cargo test -p pg-sim --all-targets
      - name: Commit validated correction
        run: |
          if git diff --quiet -- crates/pg-sim/src/lib.rs; then
            echo 'No source changes'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add crates/pg-sim/src/lib.rs
            git commit -m 'fix(sim): resolve Clippy nested-condition warnings'
            git push
          fi
