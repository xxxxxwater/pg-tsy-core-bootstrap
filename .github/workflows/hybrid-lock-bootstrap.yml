name: hybrid-lock-bootstrap
on:
  push:
    branches: [feat/hybrid-sim-rl-orders-20260920]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Generate lockfile
        run: cargo generate-lockfile
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet Cargo.lock; then
            echo "Cargo.lock already current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "build(rust): refresh lockfile for pg-sim and mimalloc"
            git push
          fi
      - name: Simulator tests
        run: cargo test -p pg-sim --all-targets
      - name: Simulator throughput smoke
        run: cargo run --release -p pg-sim --example throughput
