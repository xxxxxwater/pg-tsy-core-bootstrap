name: hybrid-lock-bootstrap
on:
  push:
    branches: [feat/hybrid-sim-rl-orders-20260920]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt
      - name: Format Rust simulator and resolve lockfile
        run: |
          cargo fmt --all
          cargo generate-lockfile
          cargo metadata --locked --format-version 1 > /dev/null
      - name: Commit generated changes if needed
        run: |
          if git diff --quiet -- Cargo.lock crates/pg-sim; then
            echo "Rust formatting and lockfile already current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock crates/pg-sim
            git commit -m "style(sim): apply rustfmt and synchronize Cargo.lock"
            git push
          fi
      - name: Simulator tests
        run: cargo test -p pg-sim --all-targets
      - name: Simulator throughput smoke
        run: cargo run --release -p pg-sim --example throughput
