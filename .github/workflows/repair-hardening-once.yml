# One-shot branch-only maintenance workflow. Triggered only when THIS file is
# created/modified. Never deploys, signs in to a venue, creates releases or
# pushes to main. All other workflows validate the resulting SHA separately.
name: repair-hardening-once
on:
  push:
    branches: [hardening/post-rc1-production-closure]
    paths: [.github/workflows/repair-hardening-once.yml]
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == 'xxxxxwater/pg-tsy-core-bootstrap'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt,clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Sync lockfile, consume validated request identity, format Rust
        working-directory: rust
        run: |
          set -euo pipefail
          cargo metadata --format-version 1 > /dev/null
          # WireRequest.request_id is validated during deserialize and returned
          # unmodified to Python; record its use to pass strict -D warnings.
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/pg-sim/src/main.rs')
          content = path.read_text()
          anchor = 'fn simulate(request: WireRequest) -> Result<Value, String> {\n'
          assert content.count(anchor) == 1, 'unexpected simulator entrypoint'
          if 'let _validated_request_id = request.request_id;' not in content:
              content = content.replace(anchor, anchor + '    let _validated_request_id = request.request_id;\n')
          path.write_text(content)
          PY
          cargo fmt --all
          cargo metadata --locked --format-version 1 > /dev/null
          cargo fmt --check
      - name: Install Python dev requirements
        working-directory: research
        run: pip install -e '.[dev]'
      - name: Fix and verify Python import sorting
        working-directory: research
        run: |
          ruff check --fix tests/test_sim_binary.py
          ruff check .
      - name: Test and build genuine JSONL simulator executable
        working-directory: rust
        run: |
          cargo test --locked -p pg-sim --all-targets
          cargo clippy --locked -p pg-sim --all-targets -- -D warnings
          cargo build --locked --release -p pg-sim --bin pg-sim
          test -x target/release/pg-sim
      - name: Mandatory Python to Rust executable contract (no skips)
        working-directory: research
        env:
          PG_SIM_BINARY: ${{ github.workspace }}/rust/target/release/pg-sim
        run: |
          python -m pytest -q tests/test_sim_binary.py -ra
          python - <<'PY'
          import os
          from pathlib import Path
          assert Path(os.environ['PG_SIM_BINARY']).is_file()
          PY
      - name: Commit ONLY checked formatting and lockfile to this branch
        run: |
          set -euo pipefail
          git diff --check
          git add rust/Cargo.lock rust/crates/pg-sim/src/main.rs research/tests/test_sim_binary.py
          if git diff --cached --quiet; then
            echo 'No formatting or lockfile update required'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(hardening): sync lockfile and format verified simulator bridge'
          git push origin HEAD:refs/heads/hardening/post-rc1-production-closure
