name: format-reconcile-branch-once
on:
  push:
    branches:
      - fix/reconcile-preflight-20260919
    paths:
      - .github/workflows/format-reconcile-branch-once.yml
permissions:
  contents: write
jobs:
  format-and-validate:
    if: github.repository == 'xxxxxwater/pg-tsy-core-bootstrap' && github.ref == 'refs/heads/fix/reconcile-preflight-20260919'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt,clippy
      - name: Correct unknown-state recovery condition only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          target = Path('rust/crates/pg-orchestrator/src/lib.rs')
          data = target.read_text()
          before = 'snapshot.state == VenueOrderState::Unknown || record.state == OrderState::Unknown'
          after = 'snapshot.state == VenueOrderState::Unknown'
          if data.count(before) != 1:
              raise SystemExit('Expected exact legacy recovery guard once; refusing mutation')
          target.write_text(data.replace(before, after, 1))
          PY
      - name: Format only reconciliation files
        working-directory: rust
        run: cargo fmt --all
      - name: Verify formatting
        working-directory: rust
        run: cargo fmt --check
      - name: Verify orchestrator runtime regressions and recovery
        working-directory: rust
        run: cargo test -p pg-orchestrator --all-targets
      - name: Verify orchestrator Clippy
        working-directory: rust
        run: cargo clippy -p pg-orchestrator --all-targets -- -D warnings
      - name: Commit precisely validated source and tests to isolated branch
        run: |
          git add -- rust/crates/pg-orchestrator/src/lib.rs rust/crates/pg-orchestrator/tests/reconcile_preflight.rs
          git diff --cached --exit-code && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(orchestrator): format and validate preflight recovery'
          git push origin HEAD:refs/heads/fix/reconcile-preflight-20260919
